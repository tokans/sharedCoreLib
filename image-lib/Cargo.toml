[package]
name = "image-lib"
version = "0.1.0"
description = "Shared image edit/processing engine (recipe ops + watermark inpainting) for myLife Tauri apps"
edition = "2021"
rust-version = "1.77"

[lib]
name = "image_lib"
crate-type = ["rlib"]

[dependencies]
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
