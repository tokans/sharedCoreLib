[package]
name = "pdf-lib"
version = "0.1.0"
description = "Shared native PDF/ZIP text/table extraction engine (PDFium-backed, password-aware) for myLife Tauri apps"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pdf_lib"
crate-type = ["rlib"]

[dependencies]
pdfium-render = { version = "0.8", features = ["thread_safe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
